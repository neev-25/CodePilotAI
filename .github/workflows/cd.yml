name: CD — Release & Push

on:
  push:
    branches: [main]

# Only run if the `ci` workflow completed successfully for the same commit
# This is enforced by making CD depend on the CI status check (see `needs` below).
# For monorepos without environment protection, we gate on the workflow_run event
# if you prefer; here we keep it simple with a linear push-to-main gate.

jobs:
  # ── Auto-tag a versioned release ────────────────────────────────────────────
  tag-release:
    name: Tag & Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push a tag and create a release
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for changelog generation

      - name: Compute version tag
        id: version
        run: |
          DATE=$(date -u '+%Y.%m.%d')
          SHA=$(git rev-parse --short HEAD)
          echo "tag=v${DATE}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Push tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Release ${{ steps.version.outputs.tag }}" \
            --draft \
            --generate-notes

  # ── Docker Hub push (only if DOCKERHUB_TOKEN secret is configured) ──────────
  docker-push:
    name: Push Docker Images
    runs-on: ubuntu-latest
    needs: tag-release
    # Skip this job gracefully when the secret is absent (forks, initial setup)
    if: ${{ secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/codepilotai-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/codepilotai-backend:${{ needs.tag-release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/codepilotai-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/codepilotai-frontend:${{ needs.tag-release.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.codepilot.example.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
